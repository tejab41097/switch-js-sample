    function saveToLocalStorage(){
      localStorage.getItem('localStorage')
      localStorage.setItem('localStorage', new Date())
      localStorage.getItem('localStorage')
    }
    function saveToSessionStorage(){
      sessionStorage.getItem('sessionStorage')
      sessionStorage.setItem('sessionStorage', new Date())
      sessionStorage.getItem('sessionStorage')
    }
    function writeLocalAndCookie() {
      localStorage.setItem('helloKey', 'hello world');
      document.cookie = 'helloKey=hello world; path=/; max-age=31536000';
    }
    function clearLocalStorageAndCookies() {
      localStorage.clear();
      document.cookie.split(';').forEach(cookie => {
        const name = cookie.split('=')[0].trim();
        if (name) {
          document.cookie = name + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        }
      });
    }

    function fetchGeolocation() {
      var geoResult = document.getElementById('geoResult');
      if (!navigator.geolocation) {
        alert('Geolocation is not supported in this browser/WebView. Please ensure location permissions are granted to the host app.');
        geoResult.textContent = 'Geolocation not supported.';
        return;
      }
      geoResult.textContent = 'Fetching location...';
      navigator.geolocation.getCurrentPosition(
        function (position) {
          geoResult.textContent =
            'Latitude: ' + position.coords.latitude +
            ', Longitude: ' + position.coords.longitude +
            '\nAccuracy: ' + position.coords.accuracy + 'm' +
            (position.coords.altitude != null ? '\nAltitude: ' + position.coords.altitude + 'm' : '') +
            (position.coords.speed != null ? '\nSpeed: ' + position.coords.speed + ' m/s' : '');
        },
        function (error) {
          handleLocationError(error);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function handleLocationError(error) {
      var geoResult = document.getElementById('geoResult');
      console.error('Error accessing location:', error);
      switch (error.code) {
        case 1: // PERMISSION_DENIED
          geoResult.textContent = 'Location permission denied.';
          alert('Location permission was denied.');
          break;
        case 2: // POSITION_UNAVAILABLE
          geoResult.textContent = 'Location unavailable.';
          alert('Location information is unavailable. Please ensure location services are enabled on your device.');
          break;
        case 3: // TIMEOUT
          geoResult.textContent = 'Location request timed out.';
          alert('Location request timed out. Please try again.');
          break;
        default:
          geoResult.textContent = 'Error: ' + error.message;
          alert('Unable to get location: ' + error.message);
          break;
      }
    }

     function startJSCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        var legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
        if (!legacyGetUserMedia) {
          alert('Camera access is not supported in this browser/WebView. Please ensure camera permissions are granted to the host app.');
          return;
        }
        legacyGetUserMedia.call(navigator, { video: true },
          function (stream) {
            var video = document.getElementById('videoPreview');
            video.srcObject = stream;
            video.play();
          },
          function (error) { handleCameraError(error); }
        );
        return;
      }

      // Always call getUserMedia directly — on iOS WKWebView this re-prompts
      // the native permission dialog each time, even after a previous denial.
      requestCameraStream();
    }

    function requestCameraStream() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function (stream) {
          var video = document.getElementById('videoPreview');
          video.srcObject = stream;
          video.play();
        })
        .catch(function (error) { handleCameraError(error); });
    }

    function handleCameraError(error) {
      console.error('Error accessing camera:', error);
      if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
        alert('Camera permission was denied. Retry to trigger the permission prompt again.');
      } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
        alert('No camera device was found on this device.');
      } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
        alert('Camera is already in use by another application.');
      } else if (error.name === 'SecurityError') {
        alert('Camera access is blocked due to security restrictions. Ensure the page is served over HTTPS and the WebView allows camera access.');
      } else {
        alert('Unable to access the camera: ' + error.message);
      }
    }

    function fetchAuthToken() {
      PhonePe.PhonePe.build(PhonePe.Constants.Species.web).then((sdk) => {
        let res = sdk.isMethodSupported('fetchAuthToken')

        sdk.fetchAuthToken().then((res2) => {
          document.getElementById('authTokenOutput').textContent = JSON.stringify(res2);
          request = JSON.stringify(

                  JSON.stringify({ "grantToken": res2.grantToken })
                )
            }
          );
          document.getElementById('authTokenOutput').value += request;
        }).catch((err) => {
          document.getElementById('authTokenOutput').textContent = err;
        })
      })
    }

        let res = sdk.isMethodSupported('fetchAuthTokenIfConsentRecorded')

          fetchAuthToken();

    function seekLocationPermission() {
      let env = PhonePe.Constants.Species.web
      let location = PhonePe.Constants.Permission.LOCATION

      PhonePe.PhonePe.build(env, document.getElementById("osName").value).then((sdk) => {
        let res = sdk.isMethodSupported('seekPermission')
        console.log('seekPermission method supported = ' + res)

        sdk.seekPermission([location]).then((data) => {
          console.log('Receieved response from seekPermission: ' + JSON.stringify(data))

          if (data[0].permissionGranted) {
            console.log('Successfully got permission for location')
          } else if (!data[0].willShowPermissionAlertAgain) {
            console.log('Permission denied.')
            let isSupported = sdk.isMethodSupported('openSettingsPageForPermission')
            console.log('openSettingsPageForPermission method supported = ' + isSupported)
            sdk.openSettingsPageForPermission().then(data => { 
              console.log(JSON.stringify(data))
            });
          } else {
            console.log('Permission denied temporarily.')
          }
        }).catch((err) => {

        })
      }).catch((err) => {
        console.log('Failed to fetch permission with error = ' + err)
      })
    }

    function seekCameraPermission() {
      let env = PhonePe.Constants.Species.web
      let camera = PhonePe.Constants.Permission.CAMERA
      let audio = PhonePe.Constants.Permission.RECORD_AUDIO

      PhonePe.PhonePe.build(env, document.getElementById("osName").value).then((sdk) => {

        let res = sdk.isMethodSupported('seekPermission')
        console.log('seekPermission method supported = ' + res)

        sdk.seekPermission([camera, audio]).then((data) => {
          console.log('Receieved response from seekPermission: ' + JSON.stringify(data))
          for (let i = 0; i < data.length; i++) {
            const item = data[i];
            if (item.permissionGranted) {
              console.log('Successfully got permission for ', item.permission)
            } else if (!item.willShowPermissionAlertAgain) {
              console.log('willShowPermissionAlertAgain.')
              let isSupported = sdk.isMethodSupported('openSettingsPageForPermission')
              console.log('openSettingsPageForPermission method supported = ' + isSupported)
              sdk.openSettingsPageForPermission().then(() => {
                console.log('Successfully opened settings page')
              })
              break;
              console.log('Permission denied temporarily.')
            } else {

            }

    document.addEventListener('DOMContentLoaded', function () {
      const fileInput = document.getElementById('videoUpload');
      const uploadForm = document.getElementById('uploadForm');
      const fileDetailsDiv = document.getElementById('fileDetails'); // Add a div for details
      const statusDiv = document.getElementById('status');

      if (fileInput && uploadForm && fileDetailsDiv) {

        fileInput.addEventListener('change', function (event) {
          const file = event.target.files[0];
          if (file) {
            // Access file details
            const fileName = file.name;
            const fileSize = file.size; // in bytes
            const fileType = file.type;

            // Display file details
            fileDetailsDiv.innerHTML = `
          <p>Name: ${fileName}</p>
          <p>Size: ${fileSize} bytes</p>
          <p>Type: ${fileType}</p>
        `;
            const videoPreview = document.getElementById('videoPreview');
            const videoURL = URL.createObjectURL(file);
            videoPreview.src = videoURL;

            videoPreview.addEventListener('loadedmetadata', () => {
              fileDetailsDiv.innerHTML += `Video duration: ${videoPreview.duration} seconds'`
              URL.revokeObjectURL(videoURL); // Clean up
            });

          } else {
            fileDetailsDiv.innerHTML = ''; // Clear details if no file selected
          }
        });

        uploadForm.addEventListener('submit', function (event) {
          event.preventDefault();

          const file = fileInput.files[0];
          if (file) {
            statusDiv.textContent = 'Uploading...';
            const formData = new FormData(uploadForm);

            fetch('/upload', {
              method: 'POST',
              body: formData,
            })
              .then(response => {
                if (response.ok) {
                  return response.text();
                } else {
                  throw new Error('Upload failed.');
                }
              })
              .then(data => {
                statusDiv.textContent = 'Upload successful: ' + data;
              })
              .catch(error => {
                console.error('Upload error:', error);
                statusDiv.textContent = 'Upload error: ' + error.message;
              });
          } else {
            statusDiv.textContent = 'Please select a video file.';
          }
        });
      }
    });

<script>
  function callNetworkBridge() {
    const jsonInput = document.getElementById("jsonBody").value;
    const resultElement = document.getElementById("result");

    try {
      const jsonObject = JSON.parse(jsonInput);
