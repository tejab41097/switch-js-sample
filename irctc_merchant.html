 	function startTimer(duration, display) {
        var start = +Date.now() + window.pip.d, diff, minutes, seconds;
        timer();
        function timer() {
            diff = duration - (((+Date.now() + window.pip.d - start) / 1000) | 0);
			minutes = (diff / 60) | 0;
            seconds = (diff % 60) | 0;
			minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            if (diff <= 0) {
            	document.getElementById('loginbuttonw').disabled = true;
    			document.getElementById('loginbutton').disabled = true;
    			if(document.getElementById('loginResendid') != null){
					document.getElementById('loginResendid').disabled = true;

    		} else {
    			display.textContent = "expire in " + minutes + ":" + seconds + " minutes!";
    			setTimeout(function () {timer()},1000);
    	    }
        };
       	return true;
    }
